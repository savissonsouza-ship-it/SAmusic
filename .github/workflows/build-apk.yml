name: Build SAmusic APK

# Compila o APK na nuvem a cada push (e também manualmente pelo botão "Run workflow").
# Ao terminar, o APK fica disponível para download em: aba "Actions" > o run > "Artifacts".
on:
  push:
    branches: [ main, master ]
    paths-ignore: [ 'ci-logs/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Aceitar licenças do Android SDK (SDK já vem no runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Injetar JAMENDO_CLIENT_ID
        run: echo "JAMENDO_CLIENT_ID=${{ secrets.JAMENDO_CLIENT_ID }}" > local.properties

      - name: Dar permissão ao gradlew
        run: chmod +x ./gradlew

      - name: Compilar (testes + APK de depuração)
        run: |
          set -o pipefail
          (./gradlew test assembleDebug --stacktrace --no-daemon 2>&1) | tee build-out.txt

      - name: Publicar o APK como artefato
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SAmusic-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Em caso de falha, gravar o log no repositório
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 60000 build-out.txt > build-out-tail.txt || cp build-out.txt build-out-tail.txt
          gh api -X PUT "repos/${{ github.repository }}/contents/ci-logs/run-${{ github.run_id }}.txt" \
            -f message="CI log run ${{ github.run_id }} [skip ci]" \
            -f branch=main \
            -f content="$(base64 -w0 build-out-tail.txt)"
