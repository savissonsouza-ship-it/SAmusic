name: Build SAmusic APK

# Compila o APK na nuvem a cada push (e também manualmente pelo botão "Run workflow").
# Ao terminar, o APK fica disponível para download em: aba "Actions" > o run > "Artifacts".
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Aceitar licenças do Android SDK (SDK já vem no runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Injetar JAMENDO_CLIENT_ID
        # Cria local.properties com a chave vinda do segredo do repositório.
        # (Settings > Secrets and variables > Actions > New repository secret > JAMENDO_CLIENT_ID)
        # Sem o segredo, o app compila mesmo assim e mostra "Configuração necessária".
        run: echo "JAMENDO_CLIENT_ID=${{ secrets.JAMENDO_CLIENT_ID }}" > local.properties

      - name: Dar permissão ao gradlew
        run: chmod +x ./gradlew

      - name: Rodar testes unitários
        run: ./gradlew test --stacktrace

      - name: Compilar APK de depuração
        run: ./gradlew assembleDebug --stacktrace

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: SAmusic-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
